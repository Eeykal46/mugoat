name: Build IPA
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install tools
        run: |
          rustup target add aarch64-apple-ios
          brew install xcodegen
      - name: Build IPA
        working-directory: native-port
        run: |
          chmod +x build_ipa.sh
          ./build_ipa.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Mugoat-ipa
          path: native-port/Mugoat.ipa
